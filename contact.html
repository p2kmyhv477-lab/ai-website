<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系方式 - AI Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif;
            background: #050505;
            color: #e5e5e5;
            line-height: 1.8;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 24px;
        }
        h1 {
            color: #F59E0B;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 24px;
            letter-spacing: -0.02em;
        }
        h2 {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            margin-top: 40px;
            margin-bottom: 16px;
            border-bottom: 1px solid #222;
            padding-bottom: 8px;
        }
        p {
            color: #888;
            margin-bottom: 16px;
            font-size: 16px;
        }
        .back {
            display: inline-block;
            margin-bottom: 40px;
            color: #F59E0B;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .back:hover { text-decoration: underline; }
        .highlight {
            color: #F59E0B;
            font-weight: 600;
        }
        .contact-box {
            background: #0A0A0A;
            border: 1px solid #222;
            padding: 24px;
            margin-top: 20px;
        }
        .contact-box p { margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back">&larr; 返回首页</a>
        <h1>联系我们</h1>
        <p>如果您有任何问题、建议或合作意向，欢迎通过以下方式联系我们。</p>
        
        <div class="contact-box">
            <p><span class="highlight">邮箱：</span>contact@bestfreeai.site</p>
            <p><span class="highlight">网站：</span>https://www.bestfreeai.site</p>
        </div>
        
        <h2>工具提交</h2>
        <p>如果你想让我们收录你的 AI 工具，请发送邮件至 contact@bestfreeai.site，附上工具名称、网址和简介。</p>
        
        <h2>广告合作</h2>
        <p>AI Hub 提供多种广告合作形式，包括精选推荐位、横幅广告位等。如需了解详情，请发送邮件咨询。</p>
        
        <h2>问题反馈</h2>
        <p>如果你发现网站有任何问题，或者有改进建议，欢迎随时联系我们。</p>
    </div>
</body>
</html>
